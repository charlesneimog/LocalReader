<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Simple Translator</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
        }

        textarea,
        select,
        button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
        }

        #output {
            white-space: pre-wrap;
            padding: 10px;
            background: #f4f4f4;
        }
    </style>
</head>

<body>

    <h2>Translator</h2>

    <textarea id="input" rows="5" placeholder="Type text..."></textarea>

    <select id="lang">
        <option value="pt">Portuguese</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
    </select>

    <button onclick="runTranslate()">Translate</button>

    <h3>Result:</h3>
    <div id="output"></div>

    <script>
        async function translate(text, target = "pt") {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url);
            const data = await res.json();
            return data[0].map(x => x[0]).join("");
        }

        async function runTranslate() {
            const text = document.getElementById("input").value;
            const lang = document.getElementById("lang").value;
            const out = document.getElementById("output");

            out.textContent = "Translating...";

            try {
                const result = await translate(text, lang);
                out.textContent = result;
            } catch (e) {
                out.textContent = "Error translating text";
            }
        }
    </script>

</body>

</html>
