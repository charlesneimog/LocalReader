<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>translate.js Working Example</title>

        <script src="https://res.zvo.cn/translate/translate.js"></script>
    </head>
    <body>
        <h2>Translate.js Demo</h2>

        <p>Hello world. This text will be translated automatically.</p>

        <button onclick="setLang('english')">English</button>
        <button onclick="setLang('chinese_simplified')">Chinese</button>
        <button onclick="setLang('portuguese')">Portuguese</button>

        <script>
            window.onload = function () {
                translate.language.setLocal("english");
                translate.service.use("client.edge");
                translate.listener.start();
                translate.execute();
            };

            function setLang(lang) {
                translate.language.set(lang);
                translate.execute();
            }
        </script>
    </body>
</html>
